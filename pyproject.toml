[project]
name = "macro-translator"
version = "0.1.0"
description = "Free-text meal description to a macro table. The LLM interprets, the code calculates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5,<1.6",
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "pydantic>=2.14,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "etl"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
