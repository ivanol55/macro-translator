name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repository must not contain data dumps or generated databases.
      - name: No data files in git
        run: sh scripts/check_no_data_files.sh

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Tests use small fixtures and a fake LLM. They download no data.
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t macro-translator:ci .
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
